services:
  app:
    build: .
    ports:
      - "8000:9090"

    container_name: my_app_container

    env_file:
      - .env

    environment:
      - DB_HOST=host.docker.internal
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}

    volumes:
      - name-volume:/app/data

volumes:
  name-volume: