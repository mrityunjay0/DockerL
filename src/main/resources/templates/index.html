<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Gemini Edition</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header class="header-container">
    <h1>Student Management Portal</h1>
    <p class="subtitle">Spring Boot CRUD Dashboard</p>
</header>

<div class="container">

    <!-- Student Form -->
    <div class="card">
        <h2 id="formTitle">Add Student</h2>

        <form id="studentForm">
            <input type="hidden" id="studentId">

            <div class="form-grid">
                <div>
                    <label>First Name</label>
                    <input type="text" id="firstName" placeholder="e.g. John" required>
                </div>

                <div>
                    <label>Last Name</label>
                    <input type="text" id="lastName" placeholder="e.g. Doe" required>
                </div>

                <div>
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="john.doe@example.com" required>
                </div>

                <div>
                    <label>Date of Birth</label>
                    <input type="date" id="dateOfBirth" required>
                </div>

                <div>
                    <label>Address</label>
                    <input type="text" id="address" placeholder="123 Street Name" required>
                </div>

                <div>
                    <label>Grade Score</label>
                    <input type="number" id="grade" placeholder="0 - 100" min="0" max="100" required>
                </div>
            </div>

            <div class="buttons">
                <button type="submit" id="submitButton">Add Student</button>
                <button type="button" id="cancelButton" class="cancel" onclick="resetForm()">Cancel</button>
            </div>
        </form>
    </div>

    <!-- Find Student -->
    <div class="card">
        <h2>Find Student</h2>
        <div class="search-box">
            <input type="number" id="searchId" placeholder="Enter student ID...">
            <button onclick="findStudent()">Search</button>
            <button onclick="loadStudents()" class="secondary">Show All</button>
        </div>
    </div>

    <!-- Student Table -->
    <div class="card">
        <div class="table-header">
            <h2>Student Records</h2>
            <button onclick="loadStudents()" class="secondary">Refresh</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Date of Birth</th>
                    <th>Address</th>
                    <th>Grade</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="studentTableBody">
                <!-- Dynamic Records Insertion -->
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- Modal Popup -->
<div id="popupOverlay" class="popup-overlay">
    <div id="popupBox" class="popup-box">
        <div id="popupIcon" class="popup-icon">✓</div>
        <h2 id="popupTitle">Success</h2>
        <p id="popupMessage">Operation completed successfully.</p>
        <button id="popupOkayButton" class="popup-button">Acknowledge</button>
    </div>
</div>

<script src="/js/script.js"></script>
</body>

</html>
